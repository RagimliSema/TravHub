# Render Blueprint – backend (Express API) və frontend (Vite static site) birlikdə.
# Render → New → Blueprint → bu repo. "sync: false" dəyərləri Render özü soruşur
# (gizli məlumat bu faylda saxlanmır). JWT_SECRET-i Render özü təsadüfi yaradır.
# Ünvanlar gizli deyil (brauzerdə görünür), ona görə burada birbaşa yazılıb.
services:
  # ---------- Backend: https://travhub-sema-api.onrender.com ----------
  - type: web
    name: travhub-sema-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas bağlantı ünvanı (mongodb+srv://...)
      - key: MONGO_URI
        sync: false
      # frontend-in ünvanı (CORS, şifrə sıfırlama linkləri, OAuth-dan qayıdış)
      - key: CLIENT_URL
        value: https://travhub-tours.onrender.com
      # bu backend-in öz ünvanı (OAuth redirect URI-ləri bundan qurulur)
      - key: SERVER_URL
        value: https://travhub-sema-api.onrender.com

  # ---------- Frontend: https://travhub-tours.onrender.com ----------
  - type: web
    name: travhub-tours
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # React Router: /admin, /tour-details/... kimi bütün ünvanlar index.html-ə
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # backend ünvanı + /api (build zamanı oxunur)
      - key: VITE_API_URL
        value: https://travhub-sema-api.onrender.com/api
